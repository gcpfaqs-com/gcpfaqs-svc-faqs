services:
  gcpfaqs-svc-faqs-postgres:
    image: postgres:17
    container_name: gcpfaqs-svc-faqs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gcpfaqs-svc-faqs_test
    ports:
      - "5431:5432"
    volumes:
      - gcpfaqs-svc-faqs_postgres_data:/var/lib/postgresql/data

volumes:
  gcpfaqs-svc-faqs_postgres_data:
